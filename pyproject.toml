[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-hub"
version = "0.1.0"
description = "Plataforma local-first de agentes especializados para desenvolvimento, segurança e gestão de projetos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "JARVIS AI Hub Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.0",
    "ollama>=0.3.3",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.35",
    "psutil>=6.0.0",
    "python-multipart>=0.0.12",
    "cryptography>=43.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "services*", "agents*", "skills*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
