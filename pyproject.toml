[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-hub"
version = "3.0.1"
description = "Plataforma local-first de agentes especializados para desenvolvimento, segurança e gestão de projetos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "JARVIS AI Hub Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.0",
    "ollama>=0.3.3",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.35",
    "psutil>=6.0.0",
    "python-multipart>=0.0.12",
    "cryptography>=43.0.0",
    "duckdb>=1.0.0",
    "lancedb>=0.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2"
]
voice = [
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "openwakeword>=0.6.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "services*", "agents*", "skills*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "SIM102", "F841", "PLW1510", "RUF059"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "apps.api.auth.require_permission",
    "apps.api.auth.require_admin",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
