name: Quality Gates

on:
  push:
    branches: [main, "hardening/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · pytest + Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Critical lint rules (no automatic fixes)
        run: ruff check apps/api/auth.py apps/api/routers/workspace.py services/project_workspace/workspace_service.py services/model_runtime/key_vault.py services/coding_agent/providers.py apps/api/deps.py apps/api/routers/models.py services/orchestration/graph.py services/orchestration/master.py services/orchestration/workspace_actions.py tests/security/test_bootstrap_exchange_e2e.py tests/security/test_file_write_governance.py tests/security/test_agent_evidence.py tests/security/test_key_vault_encryption.py tests/security/test_workspace_project_approval.py --select F821,F401,S110,S112
      - name: Full-repository Ruff baseline report
        continue-on-error: true
        run: ruff check . --select F821,F401,S110,S112 --output-format=concise
      - name: Complete Python test suite
        run: python -m pytest -q

  dashboard:
    name: Dashboard · TypeScript + production bundle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  mobile:
    name: Flutter · analyze + tests + APK
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  authenticated-smoke:
    name: Authenticated bootstrap smoke test
    runs-on: windows-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/security/test_bootstrap_exchange_e2e.py
