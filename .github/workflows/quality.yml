name: Quality Gates

on:
  push:
    branches: [main, "hardening/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · pytest + Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Critical lint rules (no automatic fixes)
        run: ruff check apps/api/auth.py tests/security/test_bootstrap_exchange_e2e.py --select F821,F401,S110,S112
      - name: Complete Python test suite
        run: python -m pytest -q

  dashboard:
    name: Dashboard · TypeScript + production bundle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  mobile:
    name: Flutter · analyze + tests + APK
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  authenticated-smoke:
    name: Authenticated bootstrap smoke test
    runs-on: windows-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/security/test_bootstrap_exchange_e2e.py
